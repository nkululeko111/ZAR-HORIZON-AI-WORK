[project]
name = "zar-horizon-ai-workspace"
version = "0.1.0"
description = "Python tooling and shared development configuration for ZAR HORIZON AI @WORK"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "agents/business-partner",
    "agents/hacker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "apps/api/src",
    "agents/business-partner/src",
    "agents/hacker/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
