[project]
name = "zar-horizon-api"
version = "0.1.0"
description = "Shared platform API for ZAR HORIZON AI @WORK"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zar_horizon_api"]
