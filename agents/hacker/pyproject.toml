[project]
name = "zar-horizon-hacker"
version = "0.1.0"
description = "Isolated AI Hacker service boundary with no security tooling enabled"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic-settings>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zar_horizon_hacker"]
